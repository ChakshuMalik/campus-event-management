<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Campus Event Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <p class="site-name">Campus Event Management</p>
    <nav>
      <a href="index.html">Home</a>
      <a href="events.html">Events</a>
      <a href="register.html" class="active">Register</a>
    </nav>
  </header>

  <main>
    <h1 id="registration-heading">Event Registration</h1>
    <p>Fill in your details below to register for an event.</p>

    <div class="button-row">
      <button onclick="changeFontSize()">Change Heading Size</button>
      <button onclick="toggleForm()">Show / Hide Form</button>
    </div>

    <div id="form-section">
      <div class="form-row">
        <label for="student-name">Student Name</label>
        <input type="text" id="student-name" placeholder="Your full name">
      </div>

      <div class="form-row">
        <label for="roll-number">Student Roll Number</label>
        <input type="text" id="roll-number" placeholder="Your roll number">
      </div>

      <div class="form-row">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com">
      </div>

      <div class="form-row">
        <label for="event-select">Select Event</label>
        <select id="event-select">
          <option value="">-- Choose an event --</option>
          <option value="Hackathon">Hackathon</option>
          <option value="Poster Making Competition">Poster Making Competition</option>
          <option value="Inter-Department Quiz">Inter-Department Quiz</option>
          <option value="Cloud Computing Workshop">Cloud Computing Workshop</option>
        </select>
      </div>

      <button onclick="registerStudent()">Register</button>
    </div>

    <div id="reg-message"></div>
  </main>

  <footer>
    Campus Event Management - CA-1 Project
  </footer>

  <script src="script.js"></script>
</body>
</html>
